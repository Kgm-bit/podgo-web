<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POD Go Web</title>
<style>
  :root{--bg:#0d0d0d;--p1:#1b1b1b;--p2:#262626;--tx:#e8e8e8;--mu:#8a8a8a;--ac:#2fbf2f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
  body{max-width:520px;margin:0 auto;padding-bottom:30px}
  button{font:inherit;color:inherit;border:0;background:var(--p2);border-radius:8px;padding:10px}
  header{background:#2a2a2a;padding:8px;display:flex;gap:6px;align-items:center;position:sticky;top:0;z-index:5}
  header .nav{display:flex;flex-direction:column;gap:2px}
  header .nav button{padding:2px 12px;font-size:14px;line-height:1.2}
  #pName{flex:1;font-size:21px;font-weight:700;text-align:center;background:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bCon{background:#1c6e1c}
  #bCon.on{background:#444}
  #state{font-size:11px;color:var(--mu);padding:3px 10px}
  #snaps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
  #snaps button{font-size:12px;padding:9px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #snaps button.a{background:var(--ac);color:#000;font-weight:700}
  #chain{padding:6px 6px 10px;background:#141414;border-top:1px solid #222;border-bottom:3px solid var(--ac)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:8px 0}
  .io{width:30px;height:30px;border:2px solid #aaa;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#aaa}
  .blk{position:relative;flex:1;min-width:0;height:74px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 2px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 2px #0008;border:2px solid transparent}
  .blk small{font-weight:400;opacity:.9;font-size:10px;text-align:center;line-height:1.1;max-height:2.2em;overflow:hidden}
  .blk.off{filter:grayscale(1) brightness(.45)}
  .blk.sel{border-color:#fff;box-shadow:0 0 10px #fff6}
  .blk i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#0007;font-style:normal;font-size:12px;display:flex;align-items:center;justify-content:center}
  #panel{padding:0 10px}
  #ph{display:flex;align-items:center;gap:8px;padding:12px 0;font-size:19px}
  #ph b{flex:1}
  #pw{font-size:20px;padding:6px 12px}
  .par{margin:10px 0 16px}
  .par .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .par label{font-size:15px}
  .par .v{font-size:14px;color:#ddd;font-variant-numeric:tabular-nums}
  .par input[type=range]{width:100%;height:36px;margin:0}
  .seg{display:flex;gap:0}.seg button{border-radius:0;padding:8px 18px;background:#222}
  .seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
  .seg button.a{background:var(--ac);color:#000;font-weight:700}
  .blk.empty{background:#181818!important;border:2px dashed #444;color:#777;text-shadow:none;font-weight:400}
  .blk.empty.sel{border-color:#fff}
  input[type=range]{touch-action:pan-y}
  .vbtn{background:#2f2f2f;border-radius:8px;padding:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}
  #tempo{display:flex;align-items:center;gap:8px;padding:0 10px 8px}
  #tempo b{color:#9a9a9a;font-weight:400;font-size:13px}
  #tBpm{min-width:110px;font-size:17px}
  #tTap{flex:1;background:var(--ac);color:#000;font-weight:700;font-size:18px;padding:14px}
  #nm{position:fixed;inset:0;background:#000c;z-index:30;display:none;align-items:center;justify-content:center}
  #nm.show{display:flex}
  #nm .box{background:#222;border-radius:12px;padding:16px;width:86%;max-width:360px}
  #nm input,#nm select{width:100%;font-size:20px;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #555;background:#111;color:#fff}
  #nm .acts{display:flex;gap:8px;justify-content:flex-end}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#a33;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:90%;font-size:14px;text-align:center}
  #mm{position:fixed;inset:0;background:#000e;z-index:10;display:none;overflow:auto;padding:10px}
  #mm.show{display:block}
  #mm .in{max-width:520px;margin:0 auto}
  #mm input[type=search]{width:100%;font-size:16px;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;margin:8px 0}
  #tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  #tabs button{padding:6px 10px;font-size:12px;color:#000;font-weight:700}
  #tabs button.off{opacity:.35}
  #mlist button{display:block;width:100%;text-align:left;margin:3px 0;padding:11px;font-size:15px}
  #mlist button.cur{outline:2px solid var(--ac)}
  #modal{position:fixed;inset:0;background:#000d;z-index:9;display:none;overflow:auto;padding:10px}
  #modal.show{display:block}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:520px;margin:0 auto}
  #grid button{font-size:11px;padding:8px 2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;text-align:left}
  #grid button.a{background:var(--ac);color:#000}
  details{margin:14px 10px;color:var(--mu)}
  #log{background:#000;border:1px solid #333;border-radius:8px;padding:8px;font:11px/1.45 monospace;white-space:pre-wrap;height:180px;overflow:auto;color:#ccc}
  .ok{color:#51cf66}.er{color:#ff6b6b}.ev{color:#74c0fc}
</style>
</head>
<body>
<header>
  <div class="nav"><button id="pUp">▲</button><button id="pDn">▼</button></div>
  <button id="pName">— sin conexión —</button>
  <button id="bCon">Conectar</button>
</header>
<div id="state">Conecta la POD Go con el cable OTG y pulsa Conectar.</div>
<label style="display:block;font-size:12px;color:#8a8a8a;padding:0 10px 4px"><input type="checkbox" id="auto" checked> Auto-actualizar cada 5 s (detecta cambios hechos en la pedalera)</label>
<div id="snaps"></div>
<div id="tempo"><b>Tempo</b><button id="tBpm" class="vbtn">— BPM</button><button id="tTap">TAP</button></div>
<div id="chain"><div class="row" id="r1"></div><div class="row" id="r2"></div></div>
<div style="padding:6px 10px 0"><button id="undo" style="display:none;background:#555">↶ Deshacer último movimiento</button></div>
<div id="panel"><div id="ph"><b>Conecta para ver el preset</b></div><div id="pars"></div></div>

<div id="toast"></div>
<div id="nm"><div class="box"><div id="nmT" style="font-size:17px"></div><input id="nmI" type="text" inputmode="decimal" autocomplete="off"><select id="nmS" style="display:none"></select><div id="nmU" style="color:#9a9a9a;font-size:13px"></div><div class="acts"><button id="nmNo" style="background:#444">Cancelar</button><button id="nmOk" style="background:var(--ac);color:#000">Aplicar</button></div></div></div>
<div id="modal"><div style="max-width:520px;margin:0 auto 8px;text-align:right"><button id="mClose">Cerrar ✕</button></div><div id="grid"></div></div>

<div id="mm"><div class="in"><div style="text-align:right"><button id="mmClose">Cerrar ✕</button></div>
  <input id="mq" type="search" placeholder="Buscar por modelo o equipo (ej. klon, tube screamer)…"><div id="tabs"></div><div id="mlist"></div></div></div>

<details id="audio"><summary>Audio: enviar sonido a la POD Go</summary>
  <div style="margin:8px 0;color:#aaa;font-size:13px;line-height:1.4">Baja el volumen de tu amplificador antes de probar. Para que el navegador pueda ver los nombres de las salidas pide permiso de micrófono (no se graba nada).</div>
  <button id="aScan">Buscar salidas de audio</button>
  <select id="aSel" style="width:100%;margin:8px 0;padding:10px;font-size:15px;background:#222;color:#fff;border:1px solid #444;border-radius:8px"></select>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="aTone">Tono de prueba</button><input type="file" id="aFile" accept="audio/*" style="max-width:100%"></div>
  <audio id="aEl" controls style="width:100%;margin-top:8px"></audio>
  <div id="aMsg" style="font-size:13px;margin-top:6px;color:#ccc;line-height:1.4"></div>
</details>

<details><summary>Registro</summary>
  <div style="margin:6px 0"><button id="bCopy">Copiar</button> <button id="bClr">Limpiar</button></div>
  <div id="log"></div>
</details>

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hex=(u,n=60)=>Array.from(u.slice(0,n)).map(x=>x.toString(16).padStart(2,'0')).join(' ');
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none'},4000)}
function log(m,c){const s=document.createElement('div');if(c)s.className=c;s.textContent=m;$('log').appendChild(s);$('log').scrollTop=1e9}
const presetLabel=i=>String(Math.floor(i/4)+1).padStart(2,'0')+'ABCD'[i%4];

/* ---------- MessagePack mínimo ---------- */
function Fl(v){this.v=v}
function Mp(p){this.p=p}
const M=(...p)=>new Mp(p);
function enc(v){
  if(v===null||v===undefined)return[0xc0];
  if(v===true)return[0xc3];if(v===false)return[0xc2];
  if(v instanceof Fl){const a=new Uint8Array(5);a[0]=0xca;new DataView(a.buffer).setFloat32(1,v.v);return Array.from(a)}
  if(typeof v==='number'){
    if(v>=0&&v<=127)return[v];
    if(v<0&&v>=-32)return[v&255];
    if(v>=0&&v<=255)return[0xcc,v];
    return[0xcd,v>>8,v&255];
  }
  if(typeof v==='string'){const b=Array.from(v,c=>c.charCodeAt(0));return[0xa0|b.length,...b]}
  let o=[0x80|v.p.length];
  for(const[k,x]of v.p)o.push(...enc(k),...enc(x));
  return o;
}
function dec(b,i=0){
  const t=b[i],dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(t<=0x7f)return[t,i+1];if(t>=0xe0)return[t-256,i+1];
  if(t>=0x80&&t<=0x8f){let n=t&15,o={};i++;for(let k=0;k<n;k++){let a,c;[a,i]=dec(b,i);[c,i]=dec(b,i);o[a]=c}return[o,i]}
  if(t>=0x90&&t<=0x9f){let n=t&15,o=[];i++;for(let k=0;k<n;k++){let a;[a,i]=dec(b,i);o.push(a)}return[o,i]}
  if(t>=0xa0&&t<=0xbf){const n=t&31;return[String.fromCharCode(...b.slice(i+1,i+1+n)),i+1+n]}
  switch(t){
    case 0xc0:return[null,i+1];case 0xc2:return[false,i+1];case 0xc3:return[true,i+1];
    case 0xca:return[+dv.getFloat32(i+1).toFixed(5),i+5];
    case 0xcb:return[dv.getFloat64(i+1),i+9];
    case 0xcc:return[b[i+1],i+2];case 0xcd:return[dv.getUint16(i+1),i+3];case 0xce:return[dv.getUint32(i+1),i+5];
    case 0xd0:return[dv.getInt8(i+1),i+2];case 0xd1:return[dv.getInt16(i+1),i+3];
    case 0xd9:{const n=b[i+1];return[String.fromCharCode(...b.slice(i+2,i+2+n)),i+2+n]}
    case 0xda:{const n=dv.getUint16(i+1);return[String.fromCharCode(...b.slice(i+3,i+3+n)),i+3+n]}
    case 0xdc:{let n=dv.getUint16(i+1),o=[];i+=3;for(let k=0;k<n;k++){let a;[a,i]=dec(b,i);o.push(a)}return[o,i]}
    case 0xde:{let n=dv.getUint16(i+1),o={};i+=3;for(let k=0;k<n;k++){let a,c;[a,i]=dec(b,i);[c,i]=dec(b,i);o[a]=c}return[o,i]}
  }
  throw new Error('msgpack 0x'+t.toString(16));
}

/* ---------- Base de modelos y formato de valores ---------- */
let DB=null;
async function loadDB(){
  try{const r=await fetch('models.json');DB=await r.json();log('models.json cargado: '+Object.keys(DB.m).length+' modelos','ok')}
  catch(e){log('No se pudo cargar models.json: '+e.message,'er')}
}
function pf(f,x){
  return f.replace(/%(\+?)\.(\d)f/,(m,s,n)=>{let t=x.toFixed(+n);if(s&&x>0)t='+'+t;if(/^-0(\.0*)?$/.test(t))t=t.slice(1);return t}).replace('%%','%');
}
// p = [symbolicID,nombre,displayType,valueType,min,max,default]
function fmtVal(p,v){
  const dt=p[2],vt=p[3],mn=p[4],c=(DB&&DB.dt[dt])||{};
  if(vt===2)return v?'On':'Off';
  if(Array.isArray(c.format)&&typeof c.format[0]==='string'){const k=Math.round(v-mn);return c.format[k]!==undefined?c.format[k]:String(v)}
  let x=v*(c.dspToDisplayScale||1),f=c.format,fu=c.formatUnits,um=c.unitsMultiplier||1;
  if(Array.isArray(f)){
    const r=f.find(r=>x>=r.lowerBound&&x<r.upperBound)||f[f.length-1];
    f=r.format;fu=r.formatUnits;um=r.unitsMultiplier||1;
  }
  if(!f&&!fu)return vt===0?String(Math.round(v)):v.toFixed(2);
  return pf(fu||f,x*um);
}

/* ---------- Estado del preset ---------- */
const P={tempo:null,blocks:[],snaps:['SNAPSHOT 1','SNAPSHOT 2','SNAPSHOT 3','SNAPSHOT 4'],snap:0,idx:null,name:'',sel:0};
let names={};try{names=JSON.parse(localStorage.getItem('pgnames')||'{}')}catch(e){}
function saveName(i,n){names[i]=n;try{localStorage.setItem('pgnames',JSON.stringify(names))}catch(e){}}

function parsePreset(str){
  const b=Uint8Array.from(str,c=>c.charCodeAt(0)&255),blocks=[],pat=[0x82,0x15,0x00,0x16,0x9c];
  let at=-1;
  for(let k=0;k<b.length-5&&at<0;k++){let ok=true;for(let j=0;j<5;j++)if(b[k+j]!==pat[j]){ok=false;break}if(ok)at=k}
  if(at>=0){
    // array de 12 entradas: [entrada, 10 bloques, salida]; tipo 8 = campo vacío
    try{
      const[d]=dec(b,at),a=d[22];
      for(let k=1;k<=10&&k<a.length;k++){
        const c=a[k]&&a[k][20];
        if(c&&c[24]&&c[24][25]!==undefined)blocks.push({empty:false,mid:c[24][25],on:c[10]!==false,v:((c[11]&&c[11][4])||[]).slice()});
        else blocks.push({empty:true});
      }
    }catch(e){log('Error en la lista de bloques: '+e.message,'er')}
  }
  const sn=[],re=/\x04[\xa1-\xbf]([\x20-\x7e]*)\x00\x05\xca/g;let m;
  while((m=re.exec(str)))sn.push(m[1]);
  return{blocks,sn};
}
function modelOf(bl){
  if(!DB)return null;
  const sid=DB.sym[bl.mid];return sid?{sid,m:DB.m[sid]||null}:null;
}
let lastSig='',dumpWaiters=[];
function waitDump(ms){return new Promise(res=>{const w={res};dumpWaiters.push(w);setTimeout(()=>{const k=dumpWaiters.indexOf(w);if(k>=0){dumpWaiters.splice(k,1);res(false)}},ms)})}
function applyBlockDef(id,def){
  const i=id-1;if(i<0||i>9)return;
  const c=def&&def[20];
  if(c&&c[24]&&c[24][25]!==undefined){
    const b={mid:c[24][25],on:c[10]!==false,v:((c[11]&&c[11][4])||[]).slice()},mo=modelOf(b);
    P.blocks[i]={id,empty:false,mid:b.mid,on:b.on,v:b.v,sid:mo&&mo.sid,m:mo&&mo.m};
  }else P.blocks[i]={id,empty:true,on:false,v:[]};
  lastSig='';render();
}
function applyDump(str){
  P.raw=Uint8Array.from(str,c=>c.charCodeAt(0)&255);
  const w=dumpWaiters.splice(0);w.forEach(x=>x.res(true));
  const r=parsePreset(str);
  const nb=r.blocks.map((b,i)=>{
    if(b.empty)return{id:i+1,empty:true,on:false,v:[]};
    const mo=modelOf(b);return{id:i+1,empty:false,mid:b.mid,on:b.on,v:b.v,sid:mo&&mo.sid,m:mo&&mo.m};
  });
  const sig=JSON.stringify([nb.map(x=>[x.empty,x.mid,x.on,x.v]),r.sn,P.snap]);
  if(sig===lastSig)return;
  lastSig=sig;
  P.blocks=nb;
  if(r.sn.length>=4)P.snaps=r.sn.slice(0,4);
  if(P.sel>=P.blocks.length)P.sel=0;
  log(`Preset leído: ${P.blocks.filter(b=>!b.empty).length} bloques, ${P.blocks.filter(b=>b.empty).length} vacíos`,'ok');
  render();
}

/* ---------- Dibujo ---------- */
function catOf(b){const f=b.m&&b.m.f;return(DB&&DB.stems[f])||['?','#555']}
let dragFlag=false,rpT=null,UIREG={};
const dragging=()=>dragFlag||performance.now()-userTouch<1200;
function renderPanelSafe(){clearTimeout(rpT);if(dragging())rpT=setTimeout(renderPanelSafe,400);else renderPanel()}
if(typeof document.addEventListener==='function'){
  document.addEventListener('pointerdown',e=>{if(e.target&&e.target.type==='range')dragFlag=true});
  const up=()=>{if(dragFlag){dragFlag=false;userTouch=performance.now()}};
  document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
}
function liveParam(b,k,val){
  b.v[k]=val;
  if(P.blocks[P.sel]!==b)return;
  const reg=UIREG[b.id+':'+k],p=b.m.p[k];
  if(reg&&!dragging()&&!/^(TempoSync)/.test(p[0])){reg.vs.textContent=fmtVal(p,val);if(reg.r)reg.r.value=val;}
  else renderPanelSafe();
}
function render(){renderHead();renderSnaps();renderChain();renderPanelSafe();renderTempo()}
function renderHead(){
  $('pName').textContent=P.idx===null?'—':presetLabel(P.idx)+'  '+(P.name||names[P.idx]||'');
}
function renderSnaps(){
  const s=$('snaps');s.innerHTML='';
  P.snaps.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i===P.snap)b.className='a';b.onclick=()=>setSnap(i);s.appendChild(b)});
}
function renderChain(){
  const r1=$('r1'),r2=$('r2');r1.innerHTML='';r2.innerHTML='';
  const io=t=>{const d=document.createElement('div');d.className='io';d.textContent=t;return d};
  r1.appendChild(io('●'));
  P.blocks.forEach((b,i)=>{
    const d=document.createElement('div');
    if(b.empty){
      d.className='blk empty'+(i===P.sel?' sel':'');d.innerHTML='<small>Campo vacío</small>';
      d.onclick=()=>selectBlock(i);
    }else{
      const [lab,col]=catOf(b);
      d.className='blk'+(b.on?'':' off')+(i===P.sel?' sel':'');d.style.background=col;
      d.innerHTML=`${lab}<small>${b.m?b.m.n:'Modelo '+b.mid}</small><i>⏻</i>`;
      d.onclick=e=>{if(e.target.tagName==='I'){toggleBlock(i)}else selectBlock(i)};
    }
    (i<5?r1:r2).appendChild(d);
  });
  r2.appendChild(io('→'));
}
function renderPanel(){
  const ph=$('ph'),box=$('pars');box.innerHTML='';UIREG={};
  const b=P.blocks[P.sel];
  if(!b){ph.innerHTML='<b>Conecta para ver el preset</b>';return}
  if(b.empty){
    ph.style.color='#888';ph.innerHTML='<b>Campo vacío</b><button id="pm">Agregar bloque</button>';
    $('pm').onclick=()=>openModels();return;
  }
  const[lab,col]=catOf(b);
  ph.style.color=col;
  ph.innerHTML=`<b>${lab} · ${b.m?b.m.n:'Modelo '+b.mid}${b.m&&b.m.b?'<br><small style="font-weight:400;color:#9a9a9a;font-size:13px">'+basedTxt(b.m.b)+'</small>':''}</b><button id="mvL">◀</button><button id="mvR">▶</button><button id="pm">Cambiar modelo</button><button id="pw">⏻</button>`;
  $('mvL').onclick=()=>moveBlock(-1);$('mvR').onclick=()=>moveBlock(1);
  $('pw').style.background=b.on?'#1c6e1c':'#444';$('pw').onclick=()=>toggleBlock(P.sel);
  $('pm').onclick=()=>openModels();
  if(!b.m){box.innerHTML='<div style="color:#888">Sin datos de parámetros para este modelo.</div>';return}
  const ps=b.m.p,idxOf=sid=>ps.findIndex(p=>p[0]===sid);
  ps.forEach((p,i)=>{
    const sid=p[0];
    if(sid==='@enabled'||sid==='@bypassvolume')return;
    if(sid==='@trails'){const w=document.createElement('div');w.className='par';w.innerHTML='<div class="top"><label>Trails</label><span class="v" style="color:#777">aún no disponible</span></div>';box.appendChild(w);return}
    if(/^TempoSync/.test(sid))return;
    const suf=sid.replace(/^SyncSelect/,'');
    const isSel=/^SyncSelect/.test(sid);
    if(isSel){const ts=idxOf('TempoSync'+suf);if(ts>=0&&!b.v[ts])return}
    else{ // parámetro de tiempo que se oculta cuando hay sincronía activa
      const sufT=sid.replace(/^(Time|Speed)/,'');
      if(/^(Time|Speed)/.test(sid)&&/^\d*$/.test(sufT)){
        const ts=idxOf('TempoSync'+(sufT||'1'));if(ts>=0&&b.v[ts])return
      }
    }
    box.appendChild(parRow(b,p,i,isSel?idxOf('TempoSync'+suf):-1));
  });
}

/* ---------- USB: sesiones y tramas (igual que la v2 probada) ---------- */
const S={
  s80:{n:'80',a:[0x80,0x10],b:[0xed,0x03],ch:6},
  s02:{n:'02',a:[0x02,0x10],b:[0xf0,0x03],ch:4},
  s01:{n:'01',a:[0x01,0x10],b:[0xef,0x03],ch:2}
};
const SL=[S.s80,S.s02,S.s01];
let dev=null,run=false,q=Promise.resolve(),kaT=null;
function resetS(s){s.seq=2;s.sumIn=0;s.mc=1000;s.rx=null;s.hello=false}
function out(f){q=q.then(()=>dev.transferOut(1,f)).catch(e=>log('transferOut: '+e.message,'er'));return q}
function hello(s){resetS(s);const f=new Uint8Array(20);f.set([0x0c,0,0,0x28,...s.a,...s.b,0,0,0,2,0,1,0,0x21,0,0x10,0,0]);return out(f)}
function frame(s,x2,body){
  body=body||[];
  const total=16+body.length,pad=(total+3)&~3,f=new Uint8Array(pad),L=total-8,c=(0x1000+s.sumIn)>>>0;
  f[0]=L&255;f[1]=L>>8;f[3]=0x18;f.set(s.a,4);f.set(s.b,6);
  f[9]=s.seq&255;f[11]=x2;
  f[12]=c&255;f[13]=(c>>8)&255;f[14]=(c>>16)&255;f[15]=(c>>>24)&255;
  f.set(body,16);s.seq=(s.seq+1)&255;return f;
}
function sendRaw(s,payload){const n=payload.length;return out(frame(s,0x04,[1,0,s.ch,0,n&255,(n>>8)&255,0,0,...payload]))}
function sendCmd(s,cmd,args){return sendRaw(s,enc(M([102,s.mc++],[100,cmd],[101,args===undefined?null:args])))}
const ack=s=>out(frame(s,0x08));
const keep=s=>out(frame(s,0x10));

async function readLoop(){
  while(run){
    try{
      const r=await dev.transferIn(1,1024);
      if(r.status==='ok'&&r.data&&r.data.byteLength)onIn(new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength));
    }catch(e){if(run)log('transferIn: '+e.message,'er');await sleep(200)}
  }
}
function onIn(b){
  if(b.length<16)return;
  const s=SL.find(x=>x.a[0]===b[6]&&x.a[1]===b[7]);if(!s)return;
  const kind=b[3];
  if(kind===0x28){s.hello=true;return}
  if(kind!==0x18)return;
  const L=b[0]|(b[1]<<8);s.sumIn+=L-8;
  if(b.length<=16)return;
  ack(s);
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  const now=performance.now();
  const hdr=b.length>=24&&b[16]===0&&b[17]===0&&b[18]===s.ch&&b[19]===0;
  if(s.rx&&s.rx.got<s.rx.plen&&(hdr||now-s.rx.t>1500)){log(`mensaje incompleto descartado en s${s.n} (${s.rx.got}/${s.rx.plen})`,'er');s.rx=null}
  if(s.rx&&s.rx.got<s.rx.plen){
    const take=Math.min(s.rx.plen-s.rx.got,b.length-16);
    s.rx.parts.push(b.slice(16,16+take));s.rx.got+=take;s.rx.t=now;
  }else{
    const plen=dv.getUint32(20,true);
    if(plen>200000||b.length<24){log('cabecera de mensaje inválida','er');return}
    const take=Math.min(plen,b.length-24);
    s.rx={plen,got:take,parts:[b.slice(24,24+take)],t:now};
  }
  if(s.rx.got>=s.rx.plen){
    const all=new Uint8Array(s.rx.plen);let o=0;for(const p of s.rx.parts){all.set(p,o);o+=p.length}
    s.rx=null;onMsg(s,all);
  }
}

/* ---------- Mensajes entrantes ---------- */
function onMsg(s,p){
  let d;try{[d]=dec(p,0)}catch(e){log(`IN s${s.n} ${p.length}B sin decodificar: ${hex(p,24)}`);return}
  if(s===S.s02&&d&&d[105]!==undefined){onEvent(d);return}
  if(s===S.s80&&d){
    const r=d[104];
    if(d[103]!==undefined&&d[103]>1){log('ERROR de la pedalera, estado '+d[103]+' '+JSON.stringify(r).slice(0,100),'er');toast('La pedalera rechazó el comando (estado '+d[103]+'); actualizando…');scheduleRefetch()}
    if(r&&typeof r==='object'&&!Array.isArray(r)&&r[118]===15&&typeof r[119]==='number'){P.tempo=r[119];renderTempo()}
    if(r&&typeof r==='object'&&!Array.isArray(r)&&r[13]!==undefined&&r[24]&&typeof r[24]==='object'){applyBlockDef(r[13],r[24]);return}
    if(typeof r==='string'&&r.slice(1,9)==='l6-helix'){try{applyDump(r)}catch(e){log('Error al leer preset: '+e.message,'er')}return}
    if(r&&typeof r==='object'&&!Array.isArray(r)&&r[108]!==undefined&&typeof r[109]==='string'){
      P.idx=r[108];P.name=r[109].replace(/\0/g,'');saveName(P.idx,P.name);
      if(r[92]!==undefined)P.snap=r[92];
      renderHead();renderSnaps();
    }
  }
}
const NOISE=new Set([1,5,20,21,22,34,39]);   // eventos que no cambian el preset
function onEvent(d){
  const t=d[105],e=d[106]||{},inner=e[106];
  if((t===4||t===8)&&inner&&inner[108]!==undefined){
    P.idx=inner[108];P.name=names[P.idx]||'';renderHead();log('EVENTO preset → '+presetLabel(P.idx),'ev');fetchPreset(true);
  }else if(t===6&&inner&&inner[108]!==undefined&&typeof inner[109]==='string'){
    saveName(inner[108],inner[109].replace(/\0/g,''));if(inner[108]===P.idx){P.name=names[P.idx];renderHead()}
  }else if((t===42||t===46)&&e[92]!==undefined){
    P.snap=e[92];renderSnaps();log('EVENTO snapshot → '+(P.snap+1),'ev');fetchPreset(false);
  }else if(t===49&&inner&&inner[59]!==undefined){
    const b=P.blocks[inner[98]-1];if(b&&!b.empty){b.on=!!inner[59];renderChain();renderPanel()}
  }else if(t===30&&inner&&inner[119]!==undefined){
    const b=P.blocks[inner[98]-1];
    if(b&&!b.empty&&b.m){const k=paramFromAddr(b.m,inner[29]===false,inner[28]);if(k>=0)liveParam(b,k,inner[119])}
  }else if(t===22&&inner&&inner[118]===15&&inner[119]!==undefined){

  }else if(!NOISE.has(t)){

  }
}

/* ---------- Mover bloques (intercambio de posiciones contiguas) ---------- */
function spn(b,i){
  const t=b[i],nd=(tp,e,v,k)=>({t:tp,s:i,e,v,k});
  if(t<=0x7f||t>=0xe0)return nd('int',i+1,t<=0x7f?t:t-256);
  if((t>=0x80&&t<=0x8f)||t===0xde){
    let n,j;if(t===0xde){n=(b[i+1]<<8)|b[i+2];j=i+3}else{n=t&15;j=i+1}
    const kids=[];for(let q=0;q<n;q++){const k=spn(b,j),v=spn(b,k.e);j=v.e;kids.push([k,v])}
    return nd('map',j,null,kids);
  }
  if((t>=0x90&&t<=0x9f)||t===0xdc){
    let n,j;if(t===0xdc){n=(b[i+1]<<8)|b[i+2];j=i+3}else{n=t&15;j=i+1}
    const kids=[];for(let q=0;q<n;q++){const v=spn(b,j);j=v.e;kids.push(v)}
    return nd('arr',j,null,kids);
  }
  const[v,j]=dec(b,i);return nd('leaf',j,v);
}
const mg=(n,key)=>{if(!n||n.t!=='map')return null;for(const[k,v]of n.k)if(k.v===key)return v;return null};
const BLOCKED=new Set(['amp','preamp','cab','cabmicirs']);
// Devuelve el preset con las posiciones p y p+1 intercambiadas (igual que POD Go Edit) o lanza un Error explicando por qué no.
function swapBlocks(blob,p,movedTo){
  const b=Uint8Array.from(blob);
  if(!(b[10]===0xda&&b[11]===0&&b[12]===0x30))throw new Error('formato de preset desconocido');
  const root=spn(b,61);if(root.e!==b.length||root.t!=='map')throw new Error('estructura de preset inesperada');
  const chain=mg(mg(root,0),22);if(!chain||chain.k.length!==12)throw new Error('cadena no encontrada');
  const e1=chain.k[p],e2=chain.k[p+1];
  const c1=mg(e1,20),c2=mg(e2,20);
  if(!c1||!c2||c1.t!=='map'||c2.t!=='map')throw new Error('Por ahora solo puedo intercambiar dos bloques con modelo (no campos vacíos)');
  for(const c of[c1,c2]){
    const mid=mg(mg(c,24),25),sid=mid&&DB&&DB.sym[mid.v],f=sid&&DB.m[sid]&&DB.m[sid].f;
    if(!f)throw new Error('modelo desconocido');
    if(BLOCKED.has(f))throw new Error('Mover el amp o el gabinete aún no está soportado (cambia el enrutado interno)');
  }
  // asignaciones de pedal/footswitch que apuntan a estos bloques (/4[k][*]/1/5): aún no sé reordenarlas
  const l4=mg(root,4);
  if(l4)for(const n of l4.k){
    if(n.t!=='arr')continue;
    for(const d of n.k){const v=mg(mg(d,1),5);if(v&&v.t==='int'&&(v.v===p||v.v===p+1))throw new Error('Ese bloque tiene un pedal o footswitch asignado; aún no puedo moverlo sin perder la asignación')}
  }
  // referencias de controladores a posiciones: /3/8[i][*]/11/8
  const l38=mg(mg(root,3),8);
  if(l38)for(const it of l38.k){
    if(it.t!=='arr')continue;
    for(const d of it.k){
      const r=mg(mg(d,11),8);
      if(r&&r.t==='int'&&r.v>=0&&r.v<128){if(r.v===p)b[r.s]=p+1;else if(r.v===p+1)b[r.s]=p}
    }
  }
  // banderas de encendido por snapshot: /10/10[s]/3[p][1]
  const sn=mg(mg(root,10),10);
  if(sn)for(const s_ of sn.k){
    const l3=mg(s_,3);if(!l3)continue;
    const x=l3.k[p].k[1],y=l3.k[p+1].k[1];
    if(x.e-x.s!==1||y.e-y.s!==1)throw new Error('banderas de snapshot inesperadas');
    const t=b[x.s];b[x.s]=b[y.s];b[y.s]=t;
  }
  // bloque seleccionado
  const r98=mg(mg(root,6),98);if(r98&&r98.t==='int')b[r98.s]=movedTo;
  // códigos de clase como los envía el editor (9→8, 23→1, 26→1)
  for(let k=1;k<=10;k++){
    const c=mg(chain.k[k],20);if(!c||c.t!=='map')continue;
    const n9=mg(c,9);if(n9&&n9.t==='int'&&n9.e-n9.s===1){const v=n9.v;if(v===9)b[n9.s]=8;else if(v===23||v===26)b[n9.s]=1}
  }
  // intercambio de entradas
  if(e1.e!==e2.s)throw new Error('entradas no contiguas');
  const A=b.slice(e1.s,e1.e),B=b.slice(e2.s,e2.e);
  b.set(B,e1.s);b.set(A,e1.s+B.length);
  // el editor añade la clave 12 (128 cadenas vacías) al final
  let out=b;
  if(!mg(root,12)){
    const n=root.k.length;if(b[61]!==(0x80|n)||n>=15)throw new Error('mapa raíz inesperado');
    const add=[0x0c,0xdc,0x00,0x80];for(let q=0;q<128;q++)add.push(0xa1,0x00);
    out=new Uint8Array(b.length+add.length);out.set(b);out.set(add,b.length);out[61]=0x80|(n+1);
  }
  return out;
}
async function sendBig(s,msg){
  // msg: bytes del mensaje MessagePack; se envía en tramas de ≤496 bytes de datos
  const n=msg.length,head=[1,0,s.ch,0,n&255,(n>>8)&255,(n>>16)&255,0];
  let off=0,first=true;
  while(off<n||first){

    const body=first?[...head,...msg.subarray(off,off+take)]:Array.from(msg.subarray(off,off+take));
    await out(frame(s,0x04,body));await sleep(4);
    off+=take;first=false;
  }
}
async function sendPreset(blobBytes){

}
const sigOrder=()=>P.blocks.map(b=>b.empty?'-':b.mid).join(',');

  if(dir<0&&i===0||dir>0&&i===P.blocks.length-1){toast('No se puede mover más en esa dirección');return}
  busy=true;
  try{
    await sendCmd(S.s80,22,null);const ok=await waitDump(1500);
    if(!ok||!P.raw){toast('No pude leer el preset actual; no se movió nada');return}
    const before=sigOrder(),backup=P.raw.slice();
    let nb;
    try{nb=swapBlocks(P.raw,p+1,dir<0?p+1:p+2)}catch(e){toast(e.message);log('Mover cancelado: '+e.message,'er');return}
    P.undo=backup;
    await sendPreset(nb);log(`→ mover bloque ${i+1} ${dir<0?'a la izquierda':'a la derecha'}`,'ok');
    await sleep(700);await sendCmd(S.s80,22,null);await waitDump(2000);
    const after=sigOrder(),exp=before.split(',');const t=exp[p];exp[p]=exp[p+1];exp[p+1]=t;
    if(after===exp.join(',')){P.sel=i+dir;render();toast2('Bloque movido');}
    else if(after===before){toast('La pedalera no aplicó el movimiento');log('Verificación: el orden no cambió','er')}
    else{toast('Resultado inesperado; restaurando el preset anterior');log('Verificación fallida, restaurando','er');await sendPreset(P.undo);await sleep(700);await sendCmd(S.s80,22,null)}
    $('undo').style.display=P.undo?'inline-block':'none';
  }catch(e){toast('Error al mover: '+e.message);log('Mover: '+e.message,'er')}
  finally{busy=false}
}
async function undoMove(){
  if(!P.undo||busy)return;busy=true;
  try{await sendPreset(P.undo);log('→ deshacer movimiento','ok');await sleep(700);await sendCmd(S.s80,22,null);P.undo=null;$('undo').style.display='none'}
  catch(e){toast('Error al deshacer: '+e.message)}finally{busy=false}
}
function toast2(m){const t=$('toast');t.style.background='#1c6e1c';t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';t.style.background='#a33'},2000)}

/* ---------- Selector de modelos ---------- */
const CLS={amp:17,preamp:17,cab:15,cabmicirs:26,compressor:1,distortion:1,wah:1,volumepan:1,delay:8,reverb:8,eq:23,sendreturn:9};
let MODELS=null,mTab=null,busy=false;
const nz=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[®™’']/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const basedTxt=b=>b==='Line 6 Original'?'Diseño original de Line 6':b;
const EFFECT=['distortion','compressor','gate','eq','filter','modulation','pitch-synth','reverb','delay','wah','volumepan','sendreturn'];
function allowedStems(b){
  if(!b||b.empty)return Object.keys(DB.stems).filter(f=>f!=='io'&&f!=='fixed');
  const f=b.m&&b.m.f;
  if(f==='amp'||f==='preamp')return['amp','preamp'];
  if(f==='cab'||f==='cabmicirs')return['cab','cabmicirs'];
  return EFFECT;
}
function buildModels(){
  if(MODELS||!DB)return;
  const cnt={};MODELS=[];
  DB.sym.forEach((sid,i)=>{const m=DB.m[sid];if(!m)return;MODELS.push({i,sid,n:m.n,f:m.f,b:m.b||''});const k=m.f+'|'+m.n;cnt[k]=(cnt[k]||0)+1});
  MODELS.forEach(x=>{x.h=nz(x.n+' '+x.b);if(cnt[x.f+'|'+x.n]>1){const t=/Stereo/.test(x.sid)?' (Stereo)':/Mono/.test(x.sid)?' (Mono)':' ('+x.sid.replace(/^.*_/,'')+')';x.n+=t}});
}
function openModels(){
  if(!DB){log('Falta models.json','er');return}
  buildModels();
  const b=P.blocks[P.sel],al=allowedStems(b);mTab=b&&!b.empty&&b.m&&al.includes(b.m.f)?b.m.f:al[0];
  $('mq').value='';$('mm').classList.add('show');drawModels();
}
function drawModels(){
  const tabs=$('tabs');tabs.innerHTML='';
  const al=allowedStems(P.blocks[P.sel]);
  Object.entries(DB.stems).filter(([f])=>al.includes(f)).forEach(([f,[lab,col]])=>{
    const t=document.createElement('button');t.textContent=lab+(f==='preamp'||f==='cabmicirs'?'*':'');t.style.background=col;
    if(f!==mTab)t.className='off';t.onclick=()=>{mTab=f;$('mq').value='';drawModels()};tabs.appendChild(t);
  });
  const toks=nz($('mq').value).split(' ').filter(Boolean),list=$('mlist');list.innerHTML='';
  const cur=P.blocks[P.sel];
  MODELS.filter(x=>al.includes(x.f)&&(toks.length?toks.every(k=>x.h.includes(k)):x.f===mTab)).slice(0,200).forEach(x=>{
    const t=document.createElement('button');
    const nm=document.createElement('div');nm.textContent=x.n;t.appendChild(nm);
    if(x.b){const sm=document.createElement('small');sm.textContent=basedTxt(x.b);sm.style.cssText='display:block;color:#9a9a9a;font-size:12px;margin-top:2px';t.appendChild(sm)}
    if(toks.length){const tag=document.createElement('small');tag.textContent=(DB.stems[x.f]||[''])[0];tag.style.cssText='display:block;color:#666;font-size:11px';t.appendChild(tag)}
    if(cur&&cur.mid===x.i)t.className='cur';
    t.onclick=()=>{$('mm').classList.remove('show');pickModel(x)};list.appendChild(t);
  });
}
async function pickModel(x){
  if(busy){toast('Espera a que termine el cambio anterior');return}
  const b=P.blocks[P.sel];if(!b)return;
  busy=true;
  try{
    const id=b.id;let cls=CLS[x.f];
    if(b.empty){
      // comprobar con un volcado reciente que el hueco sigue vacío (nunca se envía ningún borrado)
      await sendCmd(S.s80,23,null);await sendCmd(S.s80,22,null);
      const ok=await waitDump(1500),cur=P.blocks[id-1];
      if(!ok||!cur||!cur.empty){toast('No se pudo confirmar que el campo esté vacío; no se agregó nada');log('Agregar cancelado: campo no confirmado vacío','er');return}
      if(cls===undefined){cls=1;log('Clase de bloque sin confirmar para '+x.f+', probando con 1','er')}
      await sendCmd(S.s80,39,M([98,id],[99,M([19,6],[20,M([24,M([23,false],[25,x.i],[26,-1])],[9,cls],[10,true])])]));
      log(`→ agregar ${x.n} en bloque ${id}`,'ok');
    }else{
      await sendCmd(S.s80,40,M([98,id],[100,M([23,false],[25,x.i],[26,-1])]));
      log(`→ bloque ${id}: ${x.n}`,'ok');
    }
    await sleep(120);await sendCmd(S.s80,23,null);await sendCmd(S.s80,22,null);
    if(x.f==='amp'||x.f==='preamp'){ // igual que POD Go Edit: el gabinete puede cambiar con el amp
      await sleep(120);await sendCmd(S.s80,24,M([118,118]));await sendCmd(S.s80,45,M([98,id+1]));
      await sleep(80);await sendCmd(S.s80,23,null);await sendCmd(S.s80,22,null);
    }
    setTimeout(()=>{const c=P.blocks[id-1];if(!c||c.empty||c.mid!==x.i){toast('El cambio no se aplicó en la pedalera');log('Verificación: el bloque '+id+' no cambió a '+x.n,'er')}},1800);
  }finally{busy=false}
}
$('mq').oninput=drawModels;$('undo').onclick=undoMove;$('mmClose').onclick=()=>$('mm').classList.remove('show');

/* ---------- Conexión ---------- */
async function connect(){
  try{
    if(!DB)await loadDB();
    dev=await navigator.usb.requestDevice({filters:[{vendorId:0x0e41}]});
    await dev.open();
    if(!dev.configuration)await dev.selectConfiguration(1);
    await dev.claimInterface(0);
    run=true;q=Promise.resolve();readLoop();
    $('state').textContent='conectando…';
    for(const s of SL){await hello(s);await sleep(80)}
    await sleep(200);
    log('hello: '+SL.map(s=>s.n+(s.hello?' ok':' sin respuesta')).join(', '),SL.every(s=>s.hello)?'ok':'er');
    for(const s of SL){await sendRaw(s,[s.ch]);await sleep(60)}
    await sleep(300);
    const init=[[S.s80,76,M()],[S.s80,23,null],[S.s80,22,null],[S.s01,254,M()],
                [S.s80,99,M()],[S.s01,1,M([107,1],[101,2])],
                [S.s80,24,M([118,14])],[S.s80,24,M([118,15])],[S.s80,24,M([118,73])],[S.s01,13,M([101,2])]];
    for(const [s,c,a] of init){await sendCmd(s,c,a);await sleep(70)}
    kaT=setInterval(()=>{for(const s of SL)keep(s)},1000);
    clearInterval(pollT);
    pollT=setInterval(()=>{
      const now=performance.now();
      if(run&&!busy&&$('auto').checked&&now-userTouch>2500&&now-lastFetch>4000)fetchPreset(false);
    },5000);
    $('state').textContent='conectado';$('bCon').textContent='Desconectar';$('bCon').className='on';
  }catch(e){log('Error: '+e.message,'er');$('state').textContent='error: '+e.message}
}
async function disconnect(){
  run=false;clearInterval(kaT);clearInterval(pollT);
  try{await dev.releaseInterface(0);await dev.close()}catch(e){}
  $('state').textContent='sin conexión';$('bCon').textContent='Conectar';$('bCon').className='';
}
$('bCon').onclick=()=>run?disconnect():connect();

/* ---------- Audio: enviar sonido a la POD Go ---------- */
const aMsg=t=>{$('aMsg').textContent=t};
async function scanAudio(){
  try{
    if(!navigator.mediaDevices){aMsg('Este navegador no permite listar dispositivos de audio.');return}
    try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}catch(e){log('Micrófono: '+e.message,'er')}
    const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput');
    const sel=$('aSel');sel.innerHTML='';
    ds.forEach(d=>sel.add(new Option(d.label||('Salida '+d.deviceId.slice(0,6)),d.deviceId)));
    const pod=ds.find(d=>/pod\s*go|line\s*6/i.test(d.label));
    if(pod){sel.value=pod.deviceId;aMsg('POD Go detectada como salida de audio. Pulsa "Tono de prueba" o carga un archivo.')}
    else if(!ds.length)aMsg('El navegador no lista salidas de audio.');
    else aMsg('La POD Go no aparece como salida de audio. En Windows instala el driver de Line 6 y elígela en Sonido; en Android el sistema debe exponerla como salida USB.');
    log('Salidas de audio: '+ds.map(d=>d.label).join(' | '),'ok');
  }catch(e){aMsg('Error: '+e.message);log('Audio: '+e.message,'er')}
}
async function aRoute(el){
  const id=$('aSel').value;
  if(!id)return true;
  if(!el.setSinkId){aMsg('Este navegador no permite elegir la salida de audio desde la página (en Android no está disponible). El sonido saldrá por la salida predeterminada del sistema.');return false}
  try{await el.setSinkId(id);return true}catch(e){aMsg('No se pudo usar esa salida: '+e.message);return false}
}
$('aScan').onclick=scanAudio;
$('aSel').onchange=()=>aRoute($('aEl'));
$('aTone').onclick=async()=>{
  try{
    const ctx=new AudioContext();
    if(ctx.setSinkId&&$('aSel').value)await ctx.setSinkId($('aSel').value);
    else if($('aSel').value)aMsg('Este navegador no permite elegir la salida para el tono; sale por la predeterminada.');
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=440;g.gain.value=0.06;
    o.connect(g);g.connect(ctx.destination);o.start();
    setTimeout(()=>{o.stop();ctx.close()},1500);
  }catch(e){aMsg('Error en el tono: '+e.message)}
};
$('aFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const el=$('aEl');el.src=URL.createObjectURL(f);
  const ok=await aRoute(el);if(ok&&$('aSel').value)aMsg('Reproduciendo hacia la salida elegida.');
  el.play().catch(()=>{});
};

/* ---------- Selector de preset ---------- */
function openGrid(){
  const g=$('grid');g.innerHTML='';
  for(let i=0;i<128;i++){
    const b=document.createElement('button');b.textContent=presetLabel(i)+' '+(names[i]||'');
    if(i===P.idx)b.className='a';b.onclick=()=>{$('modal').classList.remove('show');setPreset(i)};g.appendChild(b);
  }
  $('modal').classList.add('show');
}
$('pName').onclick=()=>{if(run)openGrid()};
$('mClose').onclick=()=>$('modal').classList.remove('show');
$('pUp').onclick=()=>{if(P.idx!==null)setPreset(P.idx-1)};
$('pDn').onclick=()=>{if(P.idx!==null)setPreset(P.idx+1)};
$('bCopy').onclick=()=>navigator.clipboard.writeText($('log').textContent).then(()=>log('Log copiado','ok'));
$('bClr').onclick=()=>{$('log').textContent=''};

if(!('usb' in navigator)){log('WebUSB no disponible: usa Chrome en Android por HTTPS','er');$('bCon').disabled=true}
else loadDB();
renderSnaps();
