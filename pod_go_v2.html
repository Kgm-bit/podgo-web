<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POD Go Web v2</title>
<style>
  :root{--bg:#121212;--card:#1e1e1e;--tx:#eee;--ac:#e8590c;--mu:#888}
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);margin:0;padding:12px;max-width:640px}
  h2{margin:4px 0 10px}
  .card{background:var(--card);border-radius:10px;padding:10px;margin-bottom:10px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  button,select,input{font-size:16px;border-radius:8px;border:1px solid #444;background:#2a2a2a;color:var(--tx);padding:10px}
  button{background:var(--ac);border:0;color:#fff}
  button.sec{background:#333}
  button:disabled{opacity:.35}
  input[type=range]{flex:1;min-width:140px;padding:0}
  input[type=number]{width:72px}
  label{color:var(--mu);font-size:13px}
  #st{font-size:15px;line-height:1.5}
  #log{background:#000;border:1px solid #333;border-radius:8px;padding:8px;font:11px/1.45 monospace;white-space:pre-wrap;height:200px;overflow:auto}
  .ok{color:#51cf66}.er{color:#ff6b6b}.ev{color:#74c0fc}
</style>
</head>
<body>
<h2>POD Go Web v2</h2>

<div class="card row">
  <button id="bCon">Conectar</button>
  <button id="bOff" class="sec" disabled>Desconectar</button>
  <span id="state" style="color:var(--mu)">sin conexión</span>
</div>

<div class="card" id="st">Preset: <b id="pName">—</b> · Snapshot: <b id="pSnap">—</b><br>Último evento: <span id="pEv" class="ev">—</span></div>

<div class="card">
  <label>Preset</label>
  <div class="row">
    <select id="bank"></select>
    <select id="letter"><option>A</option><option>B</option><option>C</option><option>D</option></select>
    <button id="bPre" disabled>Ir</button>
  </div>
</div>

<div class="card">
  <label>Snapshot</label>
  <div class="row" id="snaps"></div>
</div>

<div class="card">
  <label>Bloque (número de posición)</label>
  <div class="row">
    <input id="blk" type="number" value="8" min="0" max="15">
    <button id="bOn" disabled>Encender</button>
    <button id="bOffB" class="sec" disabled>Apagar</button>
    <button id="bSel" class="sec" disabled>Seleccionar</button>
  </div>
  <label style="display:block;margin-top:10px">Parámetro (índice) · valor 0 a 1</label>
  <div class="row">
    <input id="par" type="number" value="0" min="0" max="30">
    <input id="val" type="range" min="0" max="1" step="0.01" value="0.5" disabled>
    <span id="vv">0.50</span>
  </div>
</div>

<div class="row" style="margin-bottom:6px">
  <button id="bCopy" class="sec">Copiar log</button>
  <button id="bClr" class="sec">Limpiar</button>
</div>
<div id="log"></div>

<script>
const $=id=>document.getElementById(id);
const hex=(u,n=60)=>Array.from(u.slice(0,n)).map(x=>x.toString(16).padStart(2,'0')).join(' ');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(m,c){const s=document.createElement('div');if(c)s.className=c;s.textContent=m;$('log').appendChild(s);$('log').scrollTop=1e9}

/* ---------- UI inicial ---------- */
for(let i=1;i<=32;i++)$('bank').add(new Option(i,i));
for(let i=1;i<=4;i++){const b=document.createElement('button');b.className='sec snapb';b.textContent='Snap '+i;b.disabled=true;b.onclick=()=>setSnap(i-1);$('snaps').appendChild(b)}
const presetName=i=>(Math.floor(i/4)+1)+'ABCD'[i%4];

/* ---------- MessagePack mínimo ---------- */
function Fl(v){this.v=v}
function Mp(p){this.p=p}
const M=(...p)=>new Mp(p);
function enc(v){
  if(v===null||v===undefined)return[0xc0];
  if(v===true)return[0xc3];if(v===false)return[0xc2];
  if(v instanceof Fl){const a=new Uint8Array(5);a[0]=0xca;new DataView(a.buffer).setFloat32(1,v.v);return Array.from(a)}
  if(typeof v==='number'){
    if(v>=0&&v<=127)return[v];
    if(v<0&&v>=-32)return[v&255];
    if(v>=0&&v<=255)return[0xcc,v];
    return[0xcd,v>>8,v&255];
  }
  if(typeof v==='string'){const b=Array.from(v,c=>c.charCodeAt(0));return[0xa0|b.length,...b]}
  let o=[0x80|v.p.length];
  for(const[k,x]of v.p)o.push(...enc(k),...enc(x));
  return o;
}
function dec(b,i=0){
  const t=b[i],dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(t<=0x7f)return[t,i+1];if(t>=0xe0)return[t-256,i+1];
  if(t>=0x80&&t<=0x8f){let n=t&15,o={};i++;for(let k=0;k<n;k++){let a,c;[a,i]=dec(b,i);[c,i]=dec(b,i);o[a]=c}return[o,i]}
  if(t>=0x90&&t<=0x9f){let n=t&15,o=[];i++;for(let k=0;k<n;k++){let a;[a,i]=dec(b,i);o.push(a)}return[o,i]}
  if(t>=0xa0&&t<=0xbf){const n=t&31;return[String.fromCharCode(...b.slice(i+1,i+1+n)),i+1+n]}
  switch(t){
    case 0xc0:return[null,i+1];case 0xc2:return[false,i+1];case 0xc3:return[true,i+1];
    case 0xca:return[+dv.getFloat32(i+1).toFixed(4),i+5];
    case 0xcb:return[dv.getFloat64(i+1),i+9];
    case 0xcc:return[b[i+1],i+2];case 0xcd:return[dv.getUint16(i+1),i+3];case 0xce:return[dv.getUint32(i+1),i+5];
    case 0xd0:return[dv.getInt8(i+1),i+2];case 0xd1:return[dv.getInt16(i+1),i+3];
    case 0xd9:{const n=b[i+1];return[String.fromCharCode(...b.slice(i+2,i+2+n)),i+2+n]}
    case 0xda:{const n=dv.getUint16(i+1);return[String.fromCharCode(...b.slice(i+3,i+3+n)),i+3+n]}
    case 0xdc:{let n=dv.getUint16(i+1),o=[];i+=3;for(let k=0;k<n;k++){let a;[a,i]=dec(b,i);o.push(a)}return[o,i]}
    case 0xde:{let n=dv.getUint16(i+1),o={};i+=3;for(let k=0;k<n;k++){let a,c;[a,i]=dec(b,i);[c,i]=dec(b,i);o[a]=c}return[o,i]}
  }
  throw new Error('msgpack 0x'+t.toString(16));
}

/* ---------- Sesiones ---------- */
const S={
  s80:{n:'80',a:[0x80,0x10],b:[0xed,0x03],ch:6},
  s02:{n:'02',a:[0x02,0x10],b:[0xf0,0x03],ch:4},
  s01:{n:'01',a:[0x01,0x10],b:[0xef,0x03],ch:2}
};
const SL=[S.s80,S.s02,S.s01];
let dev=null,run=false,q=Promise.resolve(),kaT=null;

function resetS(s){s.seq=2;s.sumIn=0;s.mc=1000;s.rx=null;s.hello=false}
function out(f){q=q.then(()=>dev.transferOut(1,f)).catch(e=>log('transferOut: '+e.message,'er'));return q}

function hello(s){
  resetS(s);
  const f=new Uint8Array(20);
  f.set([0x0c,0,0,0x28,...s.a,...s.b,0,0,0,2,0,1,0,0x21,0,0x10,0,0]);
  return out(f);
}
function frame(s,x2,body){
  body=body||[];
  const total=16+body.length,pad=(total+3)&~3,f=new Uint8Array(pad),L=total-8,c=(0x1000+s.sumIn)>>>0;
  f[0]=L&255;f[1]=L>>8;f[3]=0x18;f.set(s.a,4);f.set(s.b,6);
  f[9]=s.seq&255;f[11]=x2;
  f[12]=c&255;f[13]=(c>>8)&255;f[14]=(c>>16)&255;f[15]=(c>>>24)&255;
  f.set(body,16);s.seq=(s.seq+1)&255;return f;
}
function sendRaw(s,payload){
  const n=payload.length;
  return out(frame(s,0x04,[1,0,s.ch,0,n&255,(n>>8)&255,0,0,...payload]));
}
function sendCmd(s,cmd,args){
  const p=enc(M([102,s.mc++],[100,cmd],[101,args===undefined?null:args]));
  // el contador 102 siempre va como uint16 (0xcd) y el comando 254 como 0xcc, igual que en la captura
  return sendRaw(s,p);
}
const ack=s=>out(frame(s,0x08));
const keep=s=>out(frame(s,0x10));

/* ---------- Recepción ---------- */
async function readLoop(){
  while(run){
    try{
      const r=await dev.transferIn(1,1024);
      if(r.status==='ok'&&r.data&&r.data.byteLength)onIn(new Uint8Array(r.data.buffer,r.data.byteOffset,r.data.byteLength));
    }catch(e){if(run)log('transferIn: '+e.message,'er');await sleep(200)}
  }
}
function onIn(b){
  if(b.length<16)return;
  const s=SL.find(x=>x.a[0]===b[6]&&x.a[1]===b[7]);if(!s)return;
  const kind=b[3];
  if(kind===0x28){s.hello=true;return}
  if(kind!==0x18)return;
  const L=b[0]|(b[1]<<8);s.sumIn+=L-8;
  if(b.length<=16)return;
  ack(s);
  const dv=new DataView(b.buffer,b.byteOffset,b.byteLength);
  if(s.rx&&s.rx.got<s.rx.plen){
    const take=Math.min(s.rx.plen-s.rx.got,b.length-16);
    s.rx.parts.push(b.slice(16,16+take));s.rx.got+=take;
  }else{
    const plen=dv.getUint32(20,true),take=Math.min(plen,b.length-24);
    s.rx={plen,got:take,parts:[b.slice(24,24+take)]};
  }
  if(s.rx.got>=s.rx.plen){
    const all=new Uint8Array(s.rx.plen);let o=0;for(const p of s.rx.parts){all.set(p,o);o+=p.length}
    s.rx=null;onMsg(s,all);
  }
}

/* ---------- Mensajes ---------- */
function onMsg(s,p){
  let d;try{[d]=dec(p,0)}catch(e){log(`IN s${s.n} ${p.length}B sin decodificar: ${hex(p,24)}`);return}
  if(s===S.s02&&d&&d[105]!==undefined){onEvent(d);return}
  if(s===S.s80&&d&&d[104]&&typeof d[104]==='object'&&!Array.isArray(d[104])){
    const r=d[104];
    if(typeof r[109]==='string'&&r[108]!==undefined){
      $('pName').textContent=presetName(r[108])+' · '+r[109].replace(/\0/g,'');
      if(r[92]!==undefined)$('pSnap').textContent=r[92]+1;
    }
  }
  const t=JSON.stringify(d);log(`IN s${s.n} ${t.length>160?t.slice(0,160)+'…':t}`);
}
function onEvent(d){
  const t=d[105],e=d[106]||{},inner=e[106];
  let m=null;
  if((t===4||t===8)&&inner&&inner[108]!==undefined){m='Preset → '+presetName(inner[108]);$('pName').textContent=presetName(inner[108])}
  else if((t===42||t===46)&&e[92]!==undefined){m='Snapshot → '+(e[92]+1);$('pSnap').textContent=e[92]+1}
  else if(t===49&&inner&&inner[59]!==undefined){m=`Bloque ${inner[98]} ${inner[59]?'ENCENDIDO':'APAGADO'}`}
  else if(t===30&&inner&&inner[119]!==undefined){m=`Parámetro bloque ${inner[98]} #${inner[28]} = ${inner[119]}`}
  if(m){$('pEv').textContent=m;if(t!==30)log('EVENTO '+m,'ev')}
  else log('EVENTO '+JSON.stringify(d).slice(0,140),'ev');
}

/* ---------- Conexión ---------- */
async function connect(){
  try{
    dev=await navigator.usb.requestDevice({filters:[{vendorId:0x0e41}]});
    log(`Dispositivo ${dev.productName} PID 0x${dev.productId.toString(16)}`,'ok');
    await dev.open();
    if(!dev.configuration)await dev.selectConfiguration(1);
    await dev.claimInterface(0);
    run=true;q=Promise.resolve();readLoop();
    $('state').textContent='conectando…';

    for(const s of SL){await hello(s);await sleep(80)}
    await sleep(200);
    log('hello enviado: '+SL.map(s=>s.n+(s.hello?' ok':' sin respuesta')).join(', '),SL.every(s=>s.hello)?'ok':'er');

    for(const s of SL){await sendRaw(s,[s.ch]);await sleep(60)}
    await sleep(300);

    const init=[[S.s80,76,M()],[S.s80,23,null],[S.s80,22,null],[S.s01,254,M()],
                [S.s80,99,M()],[S.s01,1,M([107,1],[101,2])],
                [S.s80,24,M([118,14])],[S.s80,24,M([118,15])],[S.s80,24,M([118,73])],[S.s01,13,M([101,2])]];
    for(const [s,c,a] of init){await sendCmd(s,c,a);await sleep(70)}

    kaT=setInterval(()=>{for(const s of SL)keep(s)},1000);
    $('state').textContent='conectado';$('state').style.color='#51cf66';
    setUI(true);
    
  }catch(e){log('Error: '+e.message,'er');$('state').textContent='error'}
}
async function disconnect(){
  run=false;clearInterval(kaT);setUI(false);
  try{await dev.releaseInterface(0);await dev.close()}catch(e){}
  $('state').textContent='sin conexión';$('state').style.color='';
}
function setUI(on){
  ['bOff','bPre','bOn','bOffB','bSel','val'].forEach(i=>$(i).disabled=!on);
  document.querySelectorAll('.snapb').forEach(b=>b.disabled=!on);
  $('bCon').disabled=on;
}

/* ---------- Comandos ---------- */
async function setPreset(i){
  await sendCmd(S.s80,20,M([107,1],[108,i]));await sleep(80);
  await sendCmd(S.s80,23,null);await sendCmd(S.s80,22,null);await sendCmd(S.s80,24,M([118,73]));
  log('→ preset '+presetName(i),'ok');
}
async function setSnap(i){
  await sendCmd(S.s80,88,M([92,i]));await sleep(60);await sendCmd(S.s80,22,null);
  log('→ snapshot '+(i+1),'ok');
}
const blk=()=>+$('blk').value;
$('bCon').onclick=connect;$('bOff').onclick=disconnect;
$('bPre').onclick=()=>setPreset((+$('bank').value-1)*4+$('letter').selectedIndex);
$('bOn').onclick=()=>{sendCmd(S.s80,41,M([98,blk()],[59,true]));log('→ bloque '+blk()+' ON','ok')};
$('bOffB').onclick=()=>{sendCmd(S.s80,41,M([98,blk()],[59,false]));log('→ bloque '+blk()+' OFF','ok')};
$('bSel').onclick=()=>{sendCmd(S.s80,78,M([98,blk()]));log('→ seleccionar bloque '+blk(),'ok')};
let lastV=0;
$('val').oninput=e=>{
  const v=+e.target.value;$('vv').textContent=v.toFixed(2);
  const now=performance.now();if(now-lastV<40)return;lastV=now;
  sendCmd(S.s80,30,M([98,blk()],[29,true],[26,0],[28,+$('par').value],[119,new Fl(v)]));
};
$('bCopy').onclick=()=>navigator.clipboard.writeText($('log').textContent).then(()=>log('Log copiado','ok'));
$('bClr').onclick=()=>{$('log').textContent=''};

if(!('usb' in navigator)){log('WebUSB no disponible: usa Chrome en Android por HTTPS','er');$('bCon').disabled=true}
else log('Listo. Conecta la POD Go con el cable OTG y pulsa Conectar.','ok');
</script>
</body>
</html>
